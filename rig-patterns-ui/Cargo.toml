[package]
name = "rig-patterns-ui"
version = "0.1.0"
edition = "2021"
authors = ["rig-patterns contributors"]
description = "Interactive web UI for demonstrating rig-patterns orchestration"

[dependencies]
rig-patterns = { path = "../" }
rig-core = "0.4"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = "0.4"
anyhow = "1.0"
